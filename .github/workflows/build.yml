name: build

on:
  push:
    branches: '**'
    tags: '**'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt on Windows
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtscxml'

      - name: Install NSIS on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y
          "$env:ProgramFiles(x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt on macOS
        if: matrix.os == 'macos-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtscxml'

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-scxml-dev

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}}

      - name: Install Application (macOS)
        if: matrix.os == 'macos-latest'
        run: cmake --install ${{github.workspace}}/build --prefix ${{github.workspace}}/bundle

      - name: zip app bundle
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent ${{github.workspace}}/bundle/minesweeper.app ${{github.workspace}}/build/minesweeper.app.zip

      - name: Upload .app Bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: minesweeper.app.zip
          path: ${{github.workspace}}/build/minesweeper.app.zip

      - name: Package Windows Installer with CPack
        if: matrix.os == 'windows-latest'
        working-directory: ${{github.workspace}}/build
        run: cpack -C ${{env.BUILD_TYPE}}

      - name: Upload Windows Installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-win64-installer.exe
          path: ${{github.workspace}}/build/Minesweeper-*-win64.exe

      - name: Package Debian Installer
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{github.workspace}}/build
        run: cpack -G DEB -C ${{env.BUILD_TYPE}}

      - name: Upload Debian Installer
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: minesweeper-linux-deb
          path: ${{github.workspace}}/build/*.deb

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minesweeper.app.zip
          path: ${{ github.workspace }}

      - uses: actions/download-artifact@v4
        with:
          name: Minesweeper-win64-installer.exe
          path: ${{ github.workspace }}

      - uses: actions/download-artifact@v4
        with:
          name: minesweeper-linux-deb
          path: ${{ github.workspace }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Release of Minesweeper version ${{ github.ref_name }}
          files: |
            ${{ github.workspace }}/Minesweeper-*.exe
            ${{ github.workspace }}/minesweeper.app.zip
            ${{ github.workspace }}/*.deb

  apt-repo:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: minesweeper-linux-deb
          path: ${{ github.workspace }}/debs

      - name: Install APT repository publishing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          printf '%s' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Checkout GitHub Pages branch
        env:
          GH_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "${GH_REPO_URL}" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "${GH_REPO_URL}" "${{ github.workspace }}/site"
          else
            mkdir -p "${{ github.workspace }}/site"
            cd "${{ github.workspace }}/site"
            git init
            git checkout --orphan gh-pages
          fi

      - name: Update signed APT repository
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: .github/scripts/publish-apt-repo.sh "${{ github.workspace }}/site" "${{ github.workspace }}/debs"

      - name: Publish GitHub Pages branch
        env:
          GH_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd "${{ github.workspace }}/site"
          git add .
          if git diff --cached --quiet; then
            echo "No APT repo changes to publish"
            exit 0
          fi
          git commit -m "Publish APT repo for ${{ github.ref_name }}"
          git push "${GH_REPO_URL}" HEAD:gh-pages
