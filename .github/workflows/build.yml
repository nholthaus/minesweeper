name: build

on:
  push:
    branches: '**'
    tags: '**'
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Qt on Windows
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtscxml'

      - name: Install NSIS on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y
          "$env:ProgramFiles(x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt on macOS
        if: matrix.os == 'macos-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtscxml'

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-scxml-dev

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}}

      - name: Install Application (macOS)
        if: matrix.os == 'macos-latest'
        run: cmake --install ${{github.workspace}}/build

      - name: zip app bundle
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent ${{github.workspace}}/build/minesweeper.app ${{github.workspace}}/build/minesweeper.app.zip

      - name: Upload .app Bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: minesweeper.app.zip
          path: ${{github.workspace}}/build/minesweeper.app.zip

      - name: Package Windows Installer with CPack
        if: matrix.os == 'windows-latest'
        working-directory: ${{github.workspace}}/build
        run: cpack -C ${{env.BUILD_TYPE}}

      - name: Upload Windows Installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Minesweeper-win64-installer.exe
          path: ${{github.workspace}}/build/Minesweeper-*-win64.exe

      - name: Package Debian Installer
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{github.workspace}}/build
        run: cpack -G DEB -C ${{env.BUILD_TYPE}}

      - name: Upload Debian Installer
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: minesweeper-linux-deb
          path: ${{github.workspace}}/build/*.deb

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minesweeper.app.zip
          path: ${{ github.workspace }}

      - uses: actions/download-artifact@v4
        with:
          name: Minesweeper-win64-installer.exe
          path: ${{ github.workspace }}

      - uses: actions/download-artifact@v4
        with:
          name: minesweeper-linux-deb
          path: ${{ github.workspace }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Release of Minesweeper version ${{ github.ref_name }}
          files: |
            ${{ github.workspace }}/Minesweeper-*.exe
            ${{ github.workspace }}/minesweeper.app.zip
            ${{ github.workspace }}/*.deb
